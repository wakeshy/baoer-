<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0369a1">
<title>潍坊市中医院 · 日结交账与财务审核中心</title>
<style>
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#071b2a;color:#0f172a}
#boot{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.card{width:min(420px,92vw);background:#fff;border-radius:18px;padding:24px;box-sizing:border-box;box-shadow:0 18px 60px rgba(0,0,0,.28);text-align:center}
.logo{width:54px;height:54px;margin:0 auto 14px;border-radius:15px;background:linear-gradient(135deg,#0369a1,#0f9f95);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
h1{font-size:20px;margin:0 0 8px}.tip{font-size:13px;color:#64748b;line-height:1.7}.bar{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:18px 0 8px}.bar i{display:block;width:35%;height:100%;background:#0284c7;border-radius:99px;animation:load 1s infinite alternate}@keyframes load{to{transform:translateX(185%)}}#err{display:none;color:#b91c1c;font-size:12px;line-height:1.6;margin-top:12px}
</style>
</head>
<body>
<div id="boot"><div class="card"><div class="logo">潍</div><h1>正在打开交账工作台</h1><div class="tip">首次载入需要读取应用文件，请稍候。</div><div class="bar"><i></i></div><div id="err"></div></div></div>
<script>
(function(){
  var names=[];
  for(var i=1;i<=15;i++)names.push('deploy/20260909/chunk'+(i<10?'0':'')+i+'.txt?v=20260909-2');
  function fail(e){
    var el=document.getElementById('err');
    if(el){el.style.display='block';el.textContent='应用加载失败：'+(e&&e.message?e.message:e)+'。请刷新页面重试。';}
  }
  Promise.all(names.map(function(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('文件读取失败 '+r.status);return r.text();});}))
  .then(function(parts){
    if(!('DecompressionStream' in window))throw new Error('当前浏览器版本过旧，请使用最新版 Safari / Chrome');
    var b64=parts.join('').replace(/\s/g,'');
    var bin=atob(b64),bytes=new Uint8Array(bin.length);
    for(var j=0;j<bin.length;j++)bytes[j]=bin.charCodeAt(j);
    var ds=new DecompressionStream('gzip');
    return new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  })
  .then(function(html){document.open();document.write(html);document.close();})
  .catch(fail);
})();
</script>
</body>
</html>
