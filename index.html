<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0369a1">
<title>潍坊市中医院 · 日结交账与财务审核中心</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(430px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:28px 24px;box-shadow:0 12px 28px rgba(15,23,42,.10);text-align:center}.logo{width:58px;height:58px;margin:0 auto 14px;border-radius:16px;background:linear-gradient(135deg,#0369a1,#0891b2);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:23px;box-shadow:0 8px 20px rgba(3,105,161,.25)}h1{font-size:18px;margin:0 0 8px}.sub{font-size:13px;color:#64748b;line-height:1.7}.bar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:20px 0 10px}.bar>i{display:block;height:100%;width:18%;background:linear-gradient(90deg,#0369a1,#0891b2);border-radius:999px;animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{width:88%}}#msg{font-size:12px;color:#64748b}.err{color:#b91c1c!important;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:12px;margin-top:14px;text-align:left;line-height:1.7}button{margin-top:12px;border:0;border-radius:10px;background:#0369a1;color:#fff;padding:10px 16px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div class="card"><div class="logo">潍</div><h1>日结交账与财务审核中心</h1><div class="sub">正在载入最新版工作台，请稍候…</div><div class="bar"><i></i></div><div id="msg">正在获取页面组件</div><div id="err"></div></div>
<script>
(async function(){
  const msg=document.getElementById('msg'),err=document.getElementById('err');
  try{
    if(typeof DecompressionStream==='undefined') throw new Error('当前浏览器版本过旧，不支持最新版页面解压。请使用最新版 Safari、Chrome 或 Edge。');
    const version='20260908-nav-v1';
    const names=Array.from({length:12},(_,i)=>'app.part'+String(i+1).padStart(2,'0')+'.txt?v='+version);
    const parts=await Promise.all(names.map(async(n,idx)=>{
      const r=await fetch(n,{cache:'no-store'});
      if(!r.ok) throw new Error('载入第 '+(idx+1)+' 个页面组件失败（'+r.status+'）');
      const t=(await r.text()).trim();
      msg.textContent='已载入 '+(idx+1)+'/12 个页面组件';
      return t;
    }));
    msg.textContent='正在打开最新版工作台…';
    const b64=parts.join('');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(!html.startsWith('<!DOCTYPE html>') || html.indexOf('日结交账')<0) throw new Error('页面组件校验失败，请刷新后重试。');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.querySelector('.bar').style.display='none';
    msg.textContent='最新版载入失败';
    err.className='err';
    err.innerHTML='<b>没有加载成功</b><br>'+String(e&&e.message||e)+'<br><button onclick="location.reload()">重新载入</button>';
  }
})();
</script>
</body>
</html>
